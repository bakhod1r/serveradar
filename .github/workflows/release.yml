name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make dist VERSION=${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/serveradar-*
            dist/SHA256SUMS
            dist/install.sh
          body_path: dist/RELEASE_NOTES.md
